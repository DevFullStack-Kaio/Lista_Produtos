<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Produtos - Projeto API</title>
  <link rel="stylesheet" href="stylesheets/style.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

</head>
<body>
  <h1>Lista de Produtos</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Descricao</th>
        <th>Marca</th>
        <th>Preco</th>
      </tr>
    </thead>
    <tbody id="tabela-produtos"></tbody>
  </table>

  <h2>Adicionar Produto</h2>
  <form id="form-produto">
    <input type="text" id="descricao" name="descricao" placeholder="Descrição" required>
    <input type="text" id="marca" name="marca" placeholder="Marca" required>
    <input type="number" id="preco" name="preco" placeholder="Preço" step="0.01" required>

    <button type="submit">Adicionar</button> 
  </form>

  <script src="javascripts/scripts.js"></script>
</body>
</html>
